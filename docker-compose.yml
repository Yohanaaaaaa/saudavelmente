version: "3.8"

services:
  api:
    image: ghcr.io/yohanaaaaaa/saudavelmente/saudavelmente-api:latest
    ports:
      - "4000:3007"
    # Segredos ficam fora da pasta da stack porque o deploy e por GitOps:
    # o Portainer reclona o repositorio e reescreve o stack.env a cada
    # atualizacao, apagando qualquer valor colocado direto no arquivo.
    #
    # O caminho abaixo e resolvido pelo compose que roda DENTRO do container
    # do Portainer, onde o volume portainer_data esta montado em /data.
    # No host o arquivo fica em:
    #   /var/lib/docker/volumes/portainer_data/_data/compose/secrets/api.env
    # Contem JWT_SECRET e APPMAX_ACCESS_TOKEN.
    env_file:
      - /data/compose/secrets/api.env
    environment:
      NODE_ENV: production
      PORT: 3007
      DATABASE_URL: ${DATABASE_URL}
      BASE_URL: ${BASE_URL}
    deploy:
      replicas: 1
      restart_policy:
        condition: any
